name: Update wallpaper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow==11.3.0
      - run: python generate.py site/wallpaper.png
      - if: hashFiles('site/overlay.png') != ''
        uses: actions/configure-pages@v5
      - if: hashFiles('site/overlay.png') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: hashFiles('site/overlay.png') != ''
        uses: actions/deploy-pages@v4
